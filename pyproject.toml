[project]
name = "hidden_moves"
version = "0.1.0"
description = "Discover, compose, and bind reusable Python capabilities."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
hidden-moves = "hidden_moves.cli:main"
hm = "hidden_moves.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
